<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join me on PickleBall</title>
<meta name="description" content="You've been invited to PickleBall: scores, belts and your squad.">
<style>
  :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--text);
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; }
  .belt { font-size: 56px; line-height: 1; }
  h1 { font-size: 28px; letter-spacing: -0.5px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.button { display: block; padding: 16px; border-radius: 14px; font-weight: 600; text-decoration: none; margin-bottom: 12px; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .code { margin-top: 20px; font-size: 13px; color: var(--muted); }
  .code b { display: block; margin-top: 6px; font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); letter-spacing: 1px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="belt" aria-hidden="true">🏆</div>
  <h1>You’ve been called up</h1>
  <p>Scores, belts and your squad. Beat them and take the belt.</p>
  <a id="open" class="button primary" href="pickleball://invite/">Open in PickleBall</a>
  <!-- Set this to the App Store or TestFlight link once the app is listed. -->
  <a id="get" class="button secondary" href="https://apps.apple.com/">Get PickleBall</a>
  <div class="code" id="codeBox" hidden>Or enter this code in the app<b id="code"></b></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get("t") || "";
  if (/^[0-9a-f]{24}$/.test(token)) {
    document.getElementById("open").href = "pickleball://invite/" + token;
    document.getElementById("code").textContent = token;
    document.getElementById("codeBox").hidden = false;
  } else {
    document.getElementById("open").hidden = true;
  }
</script>
</body>
</html>
